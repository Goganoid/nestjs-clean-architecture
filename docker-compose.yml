version: "3"

services:
  api:
    build:
      context: ./app
    command: yarn run start:prod
    env_file:
      - ./app/.env
    ports:
      - "6007"
      - 8001:8001
    depends_on:
      - postgres

  postgres:
    image: postgres:14-alpine
    ports:
      - 9010:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=root
      - POSTGRES_DB=spaceship_db

  tempo:
    container_name: tempo
    image: grafana/tempo:latest
    user: root
    ports:
      - '3200'  # tempo
      - '4317'  # otlp grpc
      - '4318'  # otlp http
    volumes:
      - ./infra/monitoring/tempo.yml:/etc/tempo.yml
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo.yml
    restart: on-failure

  loki:
    container_name: loki
    image: grafana/loki:latest
    user: root
    ports:
      - '3100:3100'
    volumes:
      - ./infra/monitoring/loki.yml:/etc/loki.yml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki.yml
    restart: on-failure

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector:latest
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - "tempo"
      - "prometheus"
    volumes:
      - ./infra/monitoring/otel-collector.yml:/etc/otel-collector.yml
    command:
      - "--config=/etc/otel-collector.yml"
    restart: on-failure


  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"

volumes:
  grafana_data:
  tempo_data:
  postgres_data:
  mongo_data:
  loki_data:
