apiVersion: apps/v1
kind: Deployment
metadata:
  name:  k8s-deployment
  namespace: default
  labels:
    app:  postgres
spec:
  selector:
    matchLabels:
      app: postgres
  replicas: 1
  template:
   
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name:  postgres-container
        image:  postgres:14-alpine
        env:
          - name: PG_DATA
            value: /var/lib/postgresql/pgdata
          - name: POSTGRES_DB
            value: spaceship_db
          - name: POSTGRES_USER
            value: root
          - name: POSTGRES_PASSWORD
            value: root
        ports:
          - containerPort: 5432
        volumeMounts:
          - mountPath: /var/lib/postgresql/data
            name: pgdata
            subPath: postgres
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  labels:
    app: backend
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi