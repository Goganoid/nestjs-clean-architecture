apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.4
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: config
          mountPath: /etc/loki.yml
          subPath: loki.yml
        args:
          - -config.file=/etc/loki.yml
      volumes:
      - name: config
        configMap:
          name: loki-config
          items:
            - key: "loki.yml"
              path: "loki.yml"
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app: loki
  ports:
    - protocol: TCP
      port: 3100
      targetPort: 3100
  type: LoadBalancer