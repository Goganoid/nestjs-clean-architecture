apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: spaceship-api
          image: goganoid/spaceship-api:latest
          envFrom:
            - configMapRef:
                name: backend-env
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30        
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8001  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-env
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: root
  POSTGRES_PASSWORD: root
  POSTGRES_DATABASE: spaceship_db
  OTLP_SERVICE_NAME: spaceship-api
  OTLP_URL: http://otel-collector:4318/v1
  OTLP_LOG_LEVEL: 'trace'
  LOKI_URL: http://loki:3100
