apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: default
data:
  otel-collector.yml: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
              cors:
                allowed_origins:
                  - http://*
                  - https://*

      processors:
        batch:

      exporters:
        otlp:
          endpoint: tempo:4317
          tls:
            insecure: true
        prometheus:
          endpoint: 0.0.0.0:9090

      extensions:
        health_check:
        pprof:
        zpages:


      service:
        extensions: [health_check, pprof, zpages]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlp]
          metrics:
            receivers: [otlp]
            exporters: [prometheus]
